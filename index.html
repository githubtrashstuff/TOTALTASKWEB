<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18151A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOTALTASK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TOTALTASK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar; calendar pane left, kanban right, each filling the viewport height; on phones one pane at a time via tabs. */
:root {
  --bg: #F6F3F2; --surface: #FFFFFF; --fg: #241F21; --muted: #7B7174; --line: #E6E0DF; --col: #EEE9E8;
  --accent: #E8505D; --accent-ink: #FFFFFF; --accent-soft: #FCE6E8; --warn: #B3261E; --ok: #1E6B3E; --amber: #9A5B00;
  --a-work-bg: #DDEBFA; --a-work-fg: #1F5A99;
  --a-home-bg: #FCEBD0; --a-home-fg: #8A5300;
  --a-finance-bg: #DDF1E4; --a-finance-fg: #1E6B3E;
  --a-health-bg: #F6E3F0; --a-health-fg: #8A2B6B;
  --a-food-bg: #FBE3D6; --a-food-fg: #9A3D12;
  --a-sleep-bg: #E4E3F6; --a-sleep-fg: #3F3C8F;
  --a-personal-bg: #D9F0EF; --a-personal-fg: #17635F;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Figtree", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18151A; --surface: #242026; --fg: #F2EDED; --muted: #A59CA0; --line: #3A3238; --col: #1F1B21;
    --accent: #FF6977; --accent-ink: #2A0A0E; --accent-soft: #4A2328; --warn: #FF9A93; --ok: #8FD6A9; --amber: #F2CE92;
    --a-work-bg: #20384F; --a-work-fg: #A8CDF2;
    --a-home-bg: #4A3719; --a-home-fg: #F2CE92;
    --a-finance-bg: #1F4030; --a-finance-fg: #A6DDB9;
    --a-health-bg: #4A2540; --a-health-fg: #F0B8DD;
    --a-food-bg: #4F2D1D; --a-food-fg: #F5BE9F;
    --a-sleep-bg: #2E2C52; --a-sleep-fg: #C3C0F5;
    --a-personal-bg: #1B3F3D; --a-personal-fg: #9EDDD8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 12px 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); display: inline-block; box-shadow: 0 0 0 4px var(--accent-soft); }
.spacer { flex: 1 1 0; }
.sync { border: 0; cursor: pointer; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--col); white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync[data-s="busy"]::before { background: var(--amber); }
.sync[data-s="error"] { color: var(--warn); }
.sync[data-s="error"]::before { background: var(--warn); }
.sync[data-s="demo"]::before { background: var(--muted); }
.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.setting .hint { grid-column: 1 / -1; }
.setting select, .setting input[type=text] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 190px; }
.setting label { font-weight: 500; }
.search { width: 190px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 500; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--warn); }
.btn.armed { background: var(--warn); color: var(--surface); border-color: var(--warn); }
.btn[disabled] { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 2px; background: var(--col); padding: 3px; border-radius: 10px; }
.tab { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 500; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.mtabs { display: none; }

main { padding-top: 14px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: stretch;
  height: calc(100dvh - var(--top, 64px) - 14px - env(safe-area-inset-top, 0px) - max(12px, env(safe-area-inset-bottom, 0px))); min-height: 480px; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

/* board */
.board-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.board-bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.board { flex: 1; min-height: 0; overflow: auto; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 8px; }
.col { flex: 0 0 248px; width: 248px; background: var(--col); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.col-head { display: flex; align-items: center; gap: 6px; }
.col-title { flex: 1; min-width: 0; border: 0; background: transparent; font-family: var(--font-display); font-weight: 600; font-size: 15px; padding: 4px 6px; border-radius: 6px; }
.col-title:hover, .col-title:focus { background: var(--surface); }
.count { font-size: 12px; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.icon-btn { border: 0; background: transparent; color: var(--muted); min-width: 26px; height: 26px; border-radius: 6px; font-size: 16px; line-height: 1; }
.icon-btn:hover { background: var(--surface); color: var(--fg); }
.icon-btn.armed { background: var(--warn); color: var(--surface); padding: 0 8px; font-size: 12px; }
.cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; border-radius: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; cursor: grab; text-align: left; width: 100%; }
.card, .chip { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.card.drag-src { display: none; }
.chip.drag-src { opacity: .35; }
.ph { flex: none; border-radius: 10px; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); overflow: hidden;
  transition: height .22s cubic-bezier(.2,.8,.2,1), margin-top .22s cubic-bezier(.2,.8,.2,1), opacity .18s; }
.drag-wrap { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; will-change: transform; }
.drag-wrap > * { margin: 0; width: 100%; height: 100%; box-sizing: border-box; border-color: var(--accent); cursor: grabbing;
  box-shadow: 0 14px 30px rgb(0 0 0 / .26), 0 2px 6px rgb(0 0 0 / .18); transform-origin: var(--gx, 50%) var(--gy, 50%);
  transition: scale .18s cubic-bezier(.2,.8,.2,1), opacity .14s; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
.drop-on { box-shadow: inset 0 0 0 2px var(--accent); }
.ghost-chip { pointer-events: none; background: var(--accent-soft); border-color: var(--accent); color: var(--accent); overflow: hidden;
  max-height: 0; margin-top: -4px; padding-block: 0; border-width: 0; opacity: 0;
  transition: max-height .16s ease, margin-top .16s ease, padding .16s ease, opacity .16s ease; }
.ghost-chip.in { max-height: 34px; margin-top: 0; padding-block: 3px; border-width: 1px; opacity: 1; }
.ghost-chip .dot { background: var(--accent); }
.card-head { display: flex; align-items: flex-start; gap: 8px; }
.card-title { font-weight: 500; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.lbls { display: flex; flex-wrap: wrap; gap: 4px; }
.lbl { width: 34px; height: 6px; border-radius: 3px; background: var(--c); }
.st { flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--muted); box-sizing: border-box;
  display: inline-grid; place-items: center; cursor: pointer; color: #fff; font-size: 11px; font-weight: 700; line-height: 1; transition: border-color .15s, background .15s; }
.st:hover { border-color: var(--fg); }
.st.wip { border-color: #3E63DD; background: conic-gradient(#3E63DD 0 50%, transparent 0); }
.st.done { border-color: #30A46C; background: #30A46C; }
.st.done::after { content: "✓"; }
.ic-badge { font-size: 13px; line-height: 1; }
.card[data-a] { background: var(--abg); border-left: 3px solid var(--afg); padding-left: 10px; }
.card[data-a] .card-title { color: var(--afg); }
.card[data-a].done .card-title { color: var(--muted); }
.card.has-cc, .chip.has-cc { --fill: color-mix(in srgb, var(--cc) 80%, var(--surface)); background: var(--fill); color: var(--ct);
  border-color: color-mix(in srgb, var(--cc) 85%, #000); border-left: 3px solid color-mix(in srgb, var(--cc), #000 25%); }
@supports (color: oklch(from red l c h)) {
  .card.has-cc, .chip.has-cc, .ev.has-cc { --fill: oklch(from var(--cc) calc(l * 1.04) calc(c * 1.25) h / .8); }
}
.card.has-cc { padding-left: 10px; }
.card.has-cc .card-title { color: var(--ct); }
.card.has-cc .meta > span:not(.lb):not(.over) { color: var(--ct); opacity: .85; }
.has-cc .st:not(.wip):not(.done) { border-color: var(--ct); }
.card, .chip, .ev { outline: 4px solid transparent; outline-offset: 0; transition: outline-color var(--hover-ms, 200ms) ease; }
.card:hover, .chip:hover, .ev:hover { outline-color: var(--ring, var(--accent)); }
.ev:hover { z-index: 4; }
.card[data-a], .ev[data-a] { --ring: var(--afg); }
.card.has-cc, .chip.has-cc, .ev.has-cc { --ring: color-mix(in srgb, var(--cc) 70%, var(--fg)); }
.card.has-cc, .chip.has-cc, .ev.has-cc {
  background-image: linear-gradient(165deg, rgb(255 255 255 / .24), rgb(255 255 255 / 0) 45%, rgb(0 0 0 / .17));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .38), inset 0 -2px 5px rgb(0 0 0 / .2), 0 3px 8px rgb(0 0 0 / .22), 0 1px 2px rgb(0 0 0 / .2);
}
.ev.has-cc.dragging-ev { box-shadow: inset 0 1px 0 rgb(255 255 255 / .38), inset 0 -2px 5px rgb(0 0 0 / .2), 0 10px 22px rgb(0 0 0 / .35); }
.ev.has-cc { --abg: var(--fill, color-mix(in srgb, var(--cc) 80%, var(--surface))); --afg: var(--ct); border-left-color: color-mix(in srgb, var(--cc), #000 25%); }
.ctx { position: fixed; z-index: 60; width: 272px; max-height: calc(100dvh - 16px); overflow: auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgb(0 0 0 / .28); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.ctx-sec { padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
.ctx-lab, .flabel { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.ctx-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 9px; font-size: 12px; color: var(--fg); }
.pill:hover { border-color: var(--muted); }
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ctx-row { display: flex; align-items: center; gap: 2px; }
.ctx-row .ctx-item { flex: 1; }
.ctx-ico { width: 32px; height: 32px; flex: none; border: 0; background: transparent; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.ctx-ico:hover { background: var(--col); color: var(--warn); }
.split[data-layout="right"] .pane-cal { order: 2; }
.ctx-item { border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: 8px; display: flex; gap: 10px; align-items: center; width: 100%; color: var(--fg); }
.ctx-item:hover { background: var(--col); }
.ctx-item.danger { color: var(--warn); }
.ctx-item.armed { background: var(--warn); color: var(--surface); }
.ctx-item .st { margin: 0; cursor: inherit; }
.sw-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.sw { height: 22px; border-radius: 6px; border: 0; background: var(--c); position: relative; cursor: pointer; padding: 0; }
.sw:hover { filter: brightness(1.12); }
.sw.on::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; position: absolute; inset: 0; display: grid; place-items: center; }
.ic-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.ic { border: 0; background: transparent; border-radius: 6px; height: 28px; font-size: 16px; padding: 0; }
.ic:hover { background: var(--col); }
.ic.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.card.done .card-title { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lb { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.pr { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.pr[data-p="1"] { color: var(--warn); } .pr[data-p="2"] { color: var(--accent); }
.carried { font-size: 11px; color: var(--amber); font-weight: 600; }
.est { font-size: 12px; color: var(--muted); }
.slot { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.due { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.due.over { color: var(--warn); font-weight: 600; }
.due.today { color: var(--accent); font-weight: 600; }
.add-card { border: 0; background: transparent; color: var(--muted); text-align: left; padding: 6px; border-radius: 8px; }
.add-card:hover { background: var(--surface); color: var(--fg); }
.inline-input { width: 100%; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); }
.add-col { flex: 0 0 200px; }
.add-col .add-card { width: 100%; border: 1px dashed var(--line); padding: 12px; }

/* areas */
[data-a="work"] { --abg: var(--a-work-bg); --afg: var(--a-work-fg); }
[data-a="home"] { --abg: var(--a-home-bg); --afg: var(--a-home-fg); }
[data-a="finance"] { --abg: var(--a-finance-bg); --afg: var(--a-finance-fg); }
[data-a="health"] { --abg: var(--a-health-bg); --afg: var(--a-health-fg); }
[data-a="food"] { --abg: var(--a-food-bg); --afg: var(--a-food-fg); }
[data-a="sleep"] { --abg: var(--a-sleep-bg); --afg: var(--a-sleep-fg); }
[data-a="personal"] { --abg: var(--a-personal-bg); --afg: var(--a-personal-fg); }
.lb { background: var(--abg, var(--col)); color: var(--afg, var(--muted)); }

/* calendar */
.cal-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.cal-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cal-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.cal-bar h2 { font-family: var(--font-display); font-size: 19px; margin: 0 6px 0 0; }
.modes { margin-left: auto; }
.cal-scroll { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.cal { min-width: 520px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow { padding: 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
.day { min-height: 92px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day:nth-child(7n) { border-right: 0; }
.day.out { background: var(--col); }
.day.out .num { color: var(--muted); }
.day-top { display: flex; justify-content: space-between; align-items: center; }
.num { font-size: 12px; font-weight: 600; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.day.today .num { background: var(--accent); color: var(--accent-ink); }
.add-day { opacity: 0; border: 0; background: transparent; color: var(--muted); width: 22px; height: 22px; border-radius: 6px; font-size: 15px; line-height: 1; }
.day:hover .add-day, .tg-ad:hover .add-day, .add-day:focus-visible { opacity: 1; }
@media (hover: none) { .add-day { opacity: .6; } }
.chip { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 6px; font-size: 12px; cursor: grab; min-width: 0; }
.chip .dot { flex: 0 0 8px; height: 8px; border-radius: 50%; background: var(--afg, var(--muted)); }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.done .t { text-decoration: line-through; color: var(--muted); }
.chip.routine { border-style: dashed; }
.more { font-size: 11px; color: var(--muted); padding-left: 4px; }
.inbox { flex: none; max-height: 150px; overflow: auto; background: var(--col); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.inbox h3 { font-family: var(--font-display); font-size: 15px; margin: 2px 4px 0; display: flex; justify-content: space-between; align-items: center; }
.inbox p { margin: 0 4px; font-size: 12px; color: var(--muted); }
.inbox-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.inbox .chip { padding: 6px 8px; font-size: 13px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

/* time grid */
.tg { flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow-y: auto; position: relative; }
.tg-top { position: sticky; top: 0; z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); }
.tg-row { display: grid; }
.tg-dh { display: flex; align-items: baseline; gap: 6px; padding: 8px 8px 6px; border-left: 1px solid var(--line); min-width: 0; }
.tg-dh .dw { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tg-dh .dn { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.tg-dh.today .dn { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; }
.tg-allday { border-top: 1px solid var(--line); }
.tg-adl { font-size: 10px; color: var(--muted); padding: 8px 4px 0 6px; line-height: 1.2; }
.tg-ad { border-left: 1px solid var(--line); padding: 4px 24px 4px 4px; min-height: 34px; display: flex; flex-direction: column; gap: 3px; position: relative; min-width: 0; }
.tg-ad .add-day { position: absolute; right: 2px; top: 4px; }
.tg-body { display: grid; position: relative; }
.tg-gutter { position: relative; }
.tg-gutter span { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.tg-col { position: relative; border-left: 1px solid var(--line); min-width: 0;
  background-image: repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hr, 60px)); }

    root.appendChild(el('div', { class: 'connect' },
      el('h1', { text: 'Подключите репозиторий задач' }),
      el('p', { text: 'Задачи хранятся в вашем приватном репозитории GitHub. Введите токен с доступом Contents: Read and write к этому репозиторию. Токен останется только в этом браузере.' }),
      el('div', { class: 'row2' }, field('Владелец', 'c-owner', owner), field('Репозиторий', 'c-repo', repo)),
      field('Токен GitHub', 'c-token', token), err,
      el('div', { class: 'actions' }, go, el('span', { class: 'spacer' }),
        el('button', { class: 'btn', text: 'Посмотреть демо', on: { click: function () { start(new DemoBackend(), true); } } }))));
    ['sync', 'search', 'btn-claude', 'new-task', 'btn-settings'].forEach(function (id) { $(id).hidden = true; });
  }
  function start(b, isDemo) {
    backend = b; demo = isDemo; files = {}; syncErr = null;
    actions = repoKey() ? (lsGet('tt-pending-v1:' + repoKey()) || []) : [];
    ['search', 'btn-claude', 'new-task', 'btn-settings'].forEach(function (id) { $(id).hidden = false; });
    ensureFile(P_BOARD); ensureFile(P_INBOX); ensureFile(P_REPORT);
    actions.forEach(function (a) { a.ops.forEach(function (op) { ensureFile(op.path); }); });
    render();
    schedulePoll();
    scheduleFlush();
  }

  /* ---------- оболочка ---------- */
  function setTop() { document.documentElement.style.setProperty('--top', $('top').offsetHeight + 'px'); }
  window.addEventListener('resize', setTop);
  $('mt-cal').addEventListener('click', function () { mtab = 'cal'; render(); });
  $('mt-board').addEventListener('click', function () { mtab = 'board'; render(); });
  $('new-task').addEventListener('click', function () { openNew({}); });
  $('btn-claude').addEventListener('click', claudeModal);
  $('btn-settings').addEventListener('click', settingsModal);
  $('search').addEventListener('input', function (e) { query = e.target.value.trim(); render(); });
  $('sync').addEventListener('click', function () { if (actions.length) flush('manual'); else poll(); });
  ['pointerdown', 'keydown', 'input'].forEach(function (t) { document.addEventListener(t, activity, true); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (settings.onHide) flush('hide'); } else poll();
  });
  window.addEventListener('pagehide', function () { if (settings.onHide) flush('hide'); });
  window.addEventListener('blur', function () { if (settings.onBlur) flush('blur'); });
  window.addEventListener('online', function () {
    if (!backend) return;
    syncErr = null;
    Object.keys(files).forEach(function (p) { if (files[p].state !== 'ready') loadFile(p); });
    flush('online');
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  setInterval(function () { var d = todayISO; tickToday(); if (d !== todayISO) softRender(); else { var n = document.querySelector('.now'); if (n) n.style.top = (nowMin() * PPM) + 'px'; } }, 60000);
  setTop();
  if (cfg && cfg.token && cfg.branch) start(new GitHubBackend(cfg), false);
  else render();
  window.__tt = { files: function () { return files; }, actions: function () { return actions; }, flush: flush, backend: function () { return backend; } };
})();
</script>
</body>
</html>
