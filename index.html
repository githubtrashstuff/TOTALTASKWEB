<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18151A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOTALTASK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TOTALTASK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: sticky top bar; calendar pane left, kanban right, each filling the viewport height; on phones one pane at a time via tabs. */
:root {
  --bg: #F6F3F2; --surface: #FFFFFF; --fg: #241F21; --muted: #7B7174; --line: #E6E0DF; --col: #EEE9E8;
  --night-rgb: 20 36 110; --work-rgb: 176 88 12; --dinner-rgb: 22 106 58;
  --accent: #E8505D; --accent-ink: #FFFFFF; --accent-soft: #FCE6E8; --warn: #B3261E; --ok: #1E6B3E; --amber: #9A5B00;
  --a-work-bg: #DDEBFA; --a-work-fg: #1F5A99;
  --a-home-bg: #FCEBD0; --a-home-fg: #8A5300;
  --a-finance-bg: #DDF1E4; --a-finance-fg: #1E6B3E;
  --a-health-bg: #F6E3F0; --a-health-fg: #8A2B6B;
  --a-food-bg: #FBE3D6; --a-food-fg: #9A3D12;
  --a-sleep-bg: #E4E3F6; --a-sleep-fg: #3F3C8F;
  --a-personal-bg: #D9F0EF; --a-personal-fg: #17635F;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Figtree", system-ui, "Segoe UI", sans-serif;
  --font-note: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --night-rgb: 30 52 150; --work-rgb: 200 100 20; --dinner-rgb: 30 130 72;
    --bg: #18151A; --surface: #242026; --fg: #F2EDED; --muted: #A59CA0; --line: #3A3238; --col: #1F1B21;
    --accent: #FF6977; --accent-ink: #2A0A0E; --accent-soft: #4A2328; --warn: #FF9A93; --ok: #8FD6A9; --amber: #F2CE92;
    --a-work-bg: #20384F; --a-work-fg: #A8CDF2;
    --a-home-bg: #4A3719; --a-home-fg: #F2CE92;
    --a-finance-bg: #1F4030; --a-finance-fg: #A6DDB9;
    --a-health-bg: #4A2540; --a-health-fg: #F0B8DD;
    --a-food-bg: #4F2D1D; --a-food-fg: #F5BE9F;
    --a-sleep-bg: #2E2C52; --a-sleep-fg: #C3C0F5;
    --a-personal-bg: #1B3F3D; --a-personal-fg: #9EDDD8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --night-rgb: 30 52 150; --work-rgb: 200 100 20; --dinner-rgb: 30 130 72;
    --bg: #18151A; --surface: #242026; --fg: #F2EDED; --muted: #A59CA0; --line: #3A3238; --col: #1F1B21;
    --accent: #FF6977; --accent-ink: #2A0A0E; --accent-soft: #4A2328; --warn: #FF9A93; --ok: #8FD6A9; --amber: #F2CE92;
    --a-work-bg: #20384F; --a-work-fg: #A8CDF2;
    --a-home-bg: #4A3719; --a-home-fg: #F2CE92;
    --a-finance-bg: #1F4030; --a-finance-fg: #A6DDB9;
    --a-health-bg: #4A2540; --a-health-fg: #F0B8DD;
    --a-food-bg: #4F2D1D; --a-food-fg: #F5BE9F;
    --a-sleep-bg: #2E2C52; --a-sleep-fg: #C3C0F5;
    --a-personal-bg: #1B3F3D; --a-personal-fg: #9EDDD8;
    color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 12px 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); display: inline-block; box-shadow: 0 0 0 4px var(--accent-soft); }
.spacer { flex: 1 1 0; }
.sync { border: 0; cursor: pointer; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--col); white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync[data-s="busy"]::before { background: var(--amber); }
.sync[data-s="error"] { color: var(--warn); }
.sync[data-s="error"]::before { background: var(--warn); }
.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.setting .hint { grid-column: 1 / -1; }
.setting select, .setting input[type=text] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 190px; }
.setting label { font-weight: 500; }
.search { width: 190px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 500; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--warn); }
.btn.armed { background: var(--warn); color: var(--surface); border-color: var(--warn); }
.btn[disabled] { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 2px; background: var(--col); padding: 3px; border-radius: 10px; }
.tab { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 500; color: var(--muted); }
.tab.ac { margin-left: 4px; font-weight: 600; letter-spacing: .04em; }
.tab.ac[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.mtabs { display: none; }

main { padding-top: 14px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: stretch;
  height: calc(100dvh - var(--top, 64px) - 14px - env(safe-area-inset-top, 0px) - max(12px, env(safe-area-inset-bottom, 0px))); min-height: 480px; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

/* board */
.board-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.board-bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.intro-run .board, .intro-run .cal-scroll { overflow-x: hidden; }
.board { flex: 1; min-height: 0; overflow: auto; display: flex; gap: 12px; align-items: flex-start; padding-bottom: 8px; }
.col { flex: 0 0 248px; width: 248px; background: var(--col); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.col-head { display: flex; align-items: center; gap: 6px; }
.col-title { flex: 1; min-width: 0; border: 0; background: transparent; font-family: var(--font-display); font-weight: 600; font-size: 15px; padding: 4px 6px; border-radius: 6px; }
.col-title:hover, .col-title:focus { background: var(--surface); }
.count { font-size: 12px; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.icon-btn { border: 0; background: transparent; color: var(--muted); min-width: 26px; height: 26px; border-radius: 6px; font-size: 16px; line-height: 1; }
.icon-btn:hover { background: var(--surface); color: var(--fg); }
.icon-btn.armed { background: var(--warn); color: var(--surface); padding: 0 8px; font-size: 12px; }
.cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; border-radius: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; cursor: grab; text-align: left; width: 100%; }
.card, .chip { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.card.drag-src { display: none; }
.chip.drag-src { opacity: .35; }
.ph { flex: none; border-radius: 10px; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); overflow: hidden;
  transition: height .22s cubic-bezier(.2,.8,.2,1), margin-top .22s cubic-bezier(.2,.8,.2,1), opacity .18s; }
.drag-wrap { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; will-change: transform; }
.drag-wrap.cloning::after { content: "+"; position: absolute; right: -8px; top: -8px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 14px; line-height: 1; box-shadow: 0 2px 6px rgb(0 0 0 / .3); }
.drag-wrap > * { margin: 0; width: 100%; height: 100%; box-sizing: border-box; border-color: var(--accent); cursor: grabbing;
  box-shadow: 0 14px 30px rgb(0 0 0 / .26), 0 2px 6px rgb(0 0 0 / .18); transform-origin: var(--gx, 50%) var(--gy, 50%);
  transition: scale .18s cubic-bezier(.2,.8,.2,1), opacity .14s; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
.drop-on { box-shadow: inset 0 0 0 2px var(--accent); }
.ghost-chip { pointer-events: none; background: var(--accent-soft); border-color: var(--accent); color: var(--accent); overflow: hidden;
  max-height: 0; margin-top: -4px; padding-block: 0; border-width: 0; opacity: 0;
  transition: max-height .16s ease, margin-top .16s ease, padding .16s ease, opacity .16s ease; }
.ghost-chip.in { max-height: 34px; margin-top: 0; padding-block: 3px; border-width: 1px; opacity: 1; }
.ghost-chip .dot { background: var(--accent); }
.card-head { display: flex; align-items: flex-start; gap: 8px; }
.card-title { font-weight: 500; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.lbls { display: flex; flex-wrap: wrap; gap: 4px; }
.lbl { width: 34px; height: 6px; border-radius: 3px; background: var(--c); }
.st { flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--muted); box-sizing: border-box;
  display: inline-grid; place-items: center; cursor: pointer; color: #fff; font-size: 11px; font-weight: 700; line-height: 1; transition: border-color .15s, background .15s; }
.st:hover { border-color: var(--fg); }
.st.wip { border-color: #3E63DD; background: conic-gradient(#3E63DD 0 50%, transparent 0); }
.st.done { border-color: #30A46C; background: #30A46C; }
.st.done::after { content: "✓"; }
.ic-badge { font-size: 13px; line-height: 1; }
.card[data-a] { background: var(--abg); border-left: 3px solid var(--afg); padding-left: 10px; }
.card[data-a] .card-title { color: var(--afg); }
.card[data-a].done .card-title { color: var(--muted); }
.card.has-cc, .chip.has-cc { --fill: color-mix(in srgb, var(--cc) 80%, var(--surface)); background: var(--fill); color: var(--ct);
  border-color: color-mix(in srgb, var(--cc) 85%, #000); border-left: 3px solid color-mix(in srgb, var(--cc), #000 25%); }
@supports (color: oklch(from red l c h)) {
  .card.has-cc, .chip.has-cc, .ev.has-cc { --fill: oklch(from var(--cc) calc(l * 1.04) calc(c * 1.25) h / .8); }
}
.card.has-cc { padding-left: 10px; }
.card.has-cc .card-title { color: var(--ct); }
.card.has-cc .meta > span:not(.lb):not(.over) { color: var(--ct); opacity: .85; }
.has-cc .st:not(.wip):not(.done) { border-color: var(--ct); }
.card, .chip, .ev { outline: 4px solid transparent; outline-offset: 0; transition: outline-color var(--hover-ms, 200ms) ease; }
.card:hover, .chip:hover, .ev:hover { outline-color: var(--ring, var(--accent)); }
.ev:hover { z-index: 4; }
.card[data-a], .ev[data-a] { --ring: var(--afg); }
.card.has-cc, .chip.has-cc, .ev.has-cc { --ring: color-mix(in srgb, var(--cc) 70%, var(--fg)); }
.card.has-cc, .chip.has-cc, .ev.has-cc {
  background-image: linear-gradient(165deg, rgb(255 255 255 / .24), rgb(255 255 255 / 0) 45%, rgb(0 0 0 / .17));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .38), inset 0 -2px 5px rgb(0 0 0 / .2), 0 3px 8px rgb(0 0 0 / .22), 0 1px 2px rgb(0 0 0 / .2);
}
.ev.has-cc.dragging-ev { box-shadow: inset 0 1px 0 rgb(255 255 255 / .38), inset 0 -2px 5px rgb(0 0 0 / .2), 0 10px 22px rgb(0 0 0 / .35); }
.card.preset { background: var(--surface); border: 2px solid var(--cc, var(--line)); padding: 9px 11px; cursor: grab; }
.card.preset .dur { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fold-btn { min-width: 34px; height: 34px; border-radius: 9px; font-size: 24px; font-weight: 600; line-height: 1; color: var(--fg); background: var(--surface); border: 1px solid var(--line); }
.fold-btn:hover { outline: 2px solid var(--accent); }
.col-mini { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--col); color: var(--fg);
  font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.col-mini:hover { background: var(--surface); outline: 2px solid var(--accent); }
.col.routines { background: var(--surface); border: 1px dashed var(--line); }
.col.routines .col-name { flex: 1; margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 15px; padding: 4px 6px; }
.ev.has-pc, .chip.has-pc { background: var(--col); color: var(--fg); border: 2px solid var(--cc); border-left: 2px solid var(--cc); opacity: 1; --abg: var(--col); --afg: var(--fg); }
.ev.has-pc.routine, .chip.has-pc.routine { border-style: solid; opacity: 1; }
.tg.live .ev { transition: outline-color var(--hover-ms, 200ms) ease, left var(--live-ms, 300ms) cubic-bezier(.22,.8,.2,1), width var(--live-ms, 300ms) cubic-bezier(.22,.8,.2,1); }
.tg.live .ev.pv.in { transition: opacity .14s, top .1s ease-out, height .1s ease-out, left var(--live-ms, 300ms) cubic-bezier(.22,.8,.2,1), width var(--live-ms, 300ms) cubic-bezier(.22,.8,.2,1); }
.ev.has-cc { --abg: var(--fill, color-mix(in srgb, var(--cc) 80%, var(--surface))); --afg: var(--ct); border-left-color: color-mix(in srgb, var(--cc), #000 25%); }
.ctx { position: fixed; z-index: 60; width: 272px; max-height: calc(100dvh - 16px); overflow: auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgb(0 0 0 / .28); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.ctx-sec { padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
.ctx-lab, .flabel { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.ctx-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 9px; font-size: 12px; color: var(--fg); }
.pill:hover { border-color: var(--muted); }
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.inf-day { position: relative; }
.inf-dh { position: sticky; top: 0; z-index: 7; box-sizing: border-box; height: 40px; min-height: 0 !important; padding: 0 28px 0 52px !important; display: flex !important; flex-direction: row !important; align-items: center; gap: 8px !important;
  background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-left: 0 !important; overflow: hidden; }
.inf-dh .dw { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.inf-dh .dn { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.inf-dh .dm { font-size: 12px; color: var(--muted); }
.inf-dh.today .dn { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; }
.inf-dh .chip { width: auto; max-width: 150px; flex: none; }
.inf-dh .add-day { position: absolute; right: 4px; top: 8px; }
.fold { border-top: 1px solid var(--line); }
.fold > summary { cursor: pointer; padding: 11px 0; font-family: var(--font-display); font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: "›"; font-size: 20px; color: var(--muted); transition: rotate .15s; }
.fold[open] > summary::after { rotate: 90deg; }
.fold > .setting:first-of-type { border-top: 0; }
.ctx-row { display: flex; align-items: center; gap: 2px; }
.ctx-row .ctx-item { flex: 1; }
.ctx-ico { width: 32px; height: 32px; flex: none; border: 0; background: transparent; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.ctx-ico:hover { background: var(--col); color: var(--warn); }
.split[data-layout="right"]:not([data-focus]) .pane-cal { order: 2; }
.split[data-focus="1"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ctx-item { border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: 8px; display: flex; gap: 10px; align-items: center; width: 100%; color: var(--fg); }
.ctx-item:hover { background: var(--col); }
.ctx-item.danger { color: var(--warn); }
.ctx-item.armed { background: var(--warn); color: var(--surface); }
.ctx-item .st { margin: 0; cursor: inherit; }
.sw-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.sw { height: 22px; border-radius: 6px; border: 0; background: var(--c); position: relative; cursor: pointer; padding: 0; }
.sw:hover { filter: brightness(1.12); }
.sw.on::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; position: absolute; inset: 0; display: grid; place-items: center; }
.ic-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.ic { border: 0; background: transparent; border-radius: 6px; height: 28px; font-size: 16px; padding: 0; }
.ic:hover { background: var(--col); }
.ic.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.card.done .card-title { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lb { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.pr { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.pr[data-p="1"] { color: var(--warn); } .pr[data-p="2"] { color: var(--accent); }
.carried { font-size: 11px; color: var(--amber); font-weight: 600; }
.est { font-size: 12px; color: var(--muted); }
.slot { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.due { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.due.over { color: var(--warn); font-weight: 600; }
.due.today { color: var(--accent); font-weight: 600; }
.add-card { border: 0; background: transparent; color: var(--muted); text-align: left; padding: 6px; border-radius: 8px; }
.add-card:hover { background: var(--surface); color: var(--fg); }
.inline-input { width: 100%; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); }
.add-col { flex: 0 0 200px; }
.add-col .add-card { width: 100%; border: 1px dashed var(--line); padding: 12px; }

/* areas */
[data-a="work"] { --abg: var(--a-work-bg); --afg: var(--a-work-fg); }
[data-a="home"] { --abg: var(--a-home-bg); --afg: var(--a-home-fg); }

  /* цветные полосы времени, часовые и минутные линии одним фоном: масштаб меняет только CSS-переменные */

    linear-gradient(rgb(var(--work-rgb) / var(--work-a, .3)), rgb(var(--work-rgb) / var(--work-a, .3))),

  background-size: 100% calc(420 * var(--ppm, 1) * 1px), 100% calc(60 * var(--ppm, 1) * 1px), 100% calc(360 * var(--ppm, 1) * 1px), 100% calc(120 * var(--ppm, 1) * 1px), 100% var(--hr, 60px), 100% var(--mi, 100000px);
  background-position: 0 0, 0 calc(1380 * var(--ppm, 1) * 1px), 0 calc(600 * var(--ppm, 1) * 1px), 0 calc(1140 * var(--ppm, 1) * 1px), 0 0, 0 0;
  background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, repeat-y, repeat-y; }

  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 99; }

  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

<script>
(function () {

      row(tr('Звуки'), 's-sound', chk('s-sound', settings.sound, function (v) { settings.sound = v; if (v) sfx('save'); }), tr('Короткие звуки при создании, переносе, выполнении и удалении.')),
      row(tr('Громкость звуков'), 's-vol', pctCtl('s-vol', 'volume')),
      row(tr('Громкость звука наведения'), 's-hvol', rngCtl('s-hvol', 'hoverVol', 0, 100, function () { sfxHover('green'); }), tr('Тихий звук при наведении на карточку, у каждого цвета свой.')),
      row(tr('Сдвиг высоты звука наведения'), 's-hshift', rngCtl('s-hshift', 'hoverShift', -48, 48, function () { sfxHover('green'); }, ' st'), tr('В полутонах (±12 — это октава). Один сдвиг для всех цветов.'))
      ]),
      group('zones', tr('Цветные полосы времени'), [
      row(tr('Прозрачность: сон (синий)'), 's-tnight', rngCtl('s-tnight', 'tNight', 0, 100, applyZones), tr('Цветные полосы времени в календаре: 23–7 сон, 10–16 работа, 19–21 ужин. Только фон, ничего не меняют.')),
      row(tr('Прозрачность: работа (оранжевый)'), 's-twork', rngCtl('s-twork', 'tWork', 0, 100, applyZones)),
      row(tr('Прозрачность: ужин (зелёный)'), 's-tdinner', rngCtl('s-tdinner', 'tDinner', 0, 100, applyZones))
      ]),
      mode === 'local' ? null : group('sync', tr('Сохранение и синхронизация'), [
      row(tr('Сохранять после паузы'), 's-idle', sel('s-idle', settings.idle,
        [[15, tr('15 секунд')], [30, tr('30 секунд')], [60, tr('1 минута')], [120, tr('2 минуты')], [300, tr('5 минут')], [600, tr('10 минут')], [0, tr('Не сохранять по паузе')]],
        function (v) { settings.idle = +v; scheduleFlush(); }),
        tr('Пока вы двигаете, пишете или держите открытым окно задачи, ничего не отправляется. Отсчёт начинается с последнего действия.')),
      row(tr('Сохранять при уходе со вкладки'), 's-hide', chk('s-hide', settings.onHide, function (v) { settings.onHide = v; }),
        tr('Переключились на другую вкладку, свернули браузер или заблокировали телефон.')),
      row(tr('Сохранять при потере фокуса окна'), 's-blur', chk('s-blur', settings.onBlur, function (v) { settings.onBlur = v; }),
        tr('Переключились в другую программу, а вкладка осталась на экране.')),
      row(tr('Объединять коммиты'), 's-squash', sel('s-squash', settings.squash,
        [['off', tr('Нет, каждое сохранение отдельно')], ['hour', tr('За час')], ['day', tr('За день')]],
        function (v) { settings.squash = v; }),
        tr('Новое сохранение заменяет предыдущий коммит сайта за этот час или день, если после него никто ничего не коммитил. История остаётся короткой, все действия перечислены в одном сообщении.')),
      row(tr('Проверять изменения'), 's-poll', sel('s-poll', settings.poll,
        [[30, tr('Раз в 30 секунд')], [60, tr('Раз в минуту')], [300, tr('Раз в 5 минут')]],
        function (v) { settings.poll = +v; schedulePoll(); }),
        tr('Как часто подтягивать правки Claude и других устройств. Также проверяется при возврате на вкладку.')),
      row(tr('Имя устройства'), 's-device', device, tr('Пишется в коммит, чтобы было видно, откуда правка.'))
      ]),
      el('div', { class: 'actions' }, saveNow, exportBtn, setExp, setImp, setFile, el('span', { class: 'spacer' }), out,
        el('button', { class: 'btn', text: tr('Закрыть'), on: { click: closeModal } }))
    ]);
  }

  /* ---------- подключение ---------- */
  function renderConnect(root) {
    root.className = ''; root.textContent = '';
    var owner = el('input', { id: 'c-owner', value: 'githubtrashstuff', autocomplete: 'off' });
    var repo = el('input', { id: 'c-repo', value: 'TOTALTASK', autocomplete: 'off' });
    var token = el('input', { id: 'c-token', type: 'password', placeholder: 'github_pat_…', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', inputmode: 'text' });
    var err = el('div', { class: 'err', hidden: true });
    var go = el('button', { class: 'btn primary', text: tr('Подключить') });
    function connect() {
      var c = { owner: owner.value.trim(), repo: repo.value.trim(), token: token.value.trim(), branch: '' };
      if (!c.owner || !c.repo || !c.token) { err.hidden = false; err.textContent = tr('Заполните все три поля.'); return; }
      go.disabled = true; go.textContent = tr('Проверяю…'); err.hidden = true;
      var b = new GitHubBackend(c);
      b.check().then(function () { cfg = c; lsSet(CFG_KEY, cfg); start(new GitHubBackend(cfg), 'github'); })
        .catch(function (e) {
          go.disabled = false; go.textContent = tr('Подключить'); err.hidden = false; sfx('error');
          err.textContent = e.status === 401 ? tr('Токен не подошёл. Проверьте, что скопировали его целиком.')
            : e.status === 404 ? tr('Репозиторий не найден, или у токена нет к нему доступа. Проверьте название и Repository access у токена.')
            : e.status ? tr('GitHub ответил: {m}', { m: e.message }) : tr('Нет связи с GitHub. Проверьте интернет.');
        });
    }
    go.addEventListener('click', connect);
    token.addEventListener('keydown', function (e) { if (e.key === 'Enter') connect(); });
    // вставка из буфера: токен, ссылка на репозиторий или «владелец/репозиторий» распознаются сами
    var note = el('div', { class: 'ok-note', hidden: true });
    function applyClip(text) {
      var t = (text || '').trim(), hit = false, m;
      if ((m = /(github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})/.exec(t))) { token.value = m[1]; hit = true; }
      else if ((m = /github\.com\/([^\/\s]+)\/([^\/\s#?]+)/.exec(t)) || (m = /^([\w.-]+)\/([\w.-]+)$/.exec(t))) { owner.value = m[1]; repo.value = m[2].replace(/\.git$/, ''); hit = true; }
      if (hit) { note.hidden = false; note.textContent = tr('Вставлено из буфера'); if (token.value && owner.value && repo.value) go.focus(); }
      return hit;
    }
    function pasteNow(silent) {
      if (!navigator.clipboard || !navigator.clipboard.readText) { if (!silent) token.focus(); return; }
      navigator.clipboard.readText().then(function (t) { if (!applyClip(t) && !silent) { err.hidden = false; err.textContent = tr('В буфере нет токена. Скопируйте его и нажмите ещё раз или вставьте вручную.'); } }, function () { if (!silent) token.focus(); });
    }
    [owner, repo, token].forEach(function (i) { i.addEventListener('paste', function (e) { var t = (e.clipboardData || window.clipboardData).getData('text'); if (applyClip(t)) e.preventDefault(); }); });
    var pasteBtn = el('button', { type: 'button', class: 'btn', text: tr('Вставить из буфера') });
    pasteBtn.addEventListener('click', function () { err.hidden = true; pasteNow(false); });
    var eye = el('button', { type: 'button', class: 'btn', text: tr('Показать'), 'aria-label': tr('Показать') });
    eye.addEventListener('click', function () { var show = token.type === 'password'; token.type = show ? 'text' : 'password'; eye.textContent = show ? tr('Скрыть') : tr('Показать'); });
    var mk = el('a', { class: 'btn', href: 'https://github.com/settings/personal-access-tokens/new', target: '_blank', rel: 'noopener', text: tr('Создать токен на GitHub ↗') });
    var form = el('div', { class: 'gh-form', hidden: true },
      el('p', { class: 'hint', text: tr('Создайте для этого репозитория токен с доступом Contents: Read and write. Токен останется только в этом браузере.') }),
      el('div', { class: 'gh-steps' }, mk),
      field(tr('Токен GitHub'), 'c-token', el('div', { class: 'token-row' }, token, pasteBtn, eye)), note,
      el('div', { class: 'row2' }, field(tr('Владелец'), 'c-owner', owner), field(tr('Репозиторий'), 'c-repo', repo)),
      err, el('div', { class: 'actions' }, go));
    var ghBtn = el('button', { class: 'btn', text: tr('Подключить GitHub') });
    function openForm() { form.hidden = false; ghBtn.hidden = true; pasteNow(true); token.focus(); }
    ghBtn.addEventListener('click', openForm);
    var localBtn = el('button', { class: 'btn primary', text: tr('Начать локально') });
    localBtn.addEventListener('click', function () { cfg = { mode: 'local' }; lsSet(CFG_KEY, cfg); start(new LocalBackend(), 'local'); });
    var lang = el('select', { id: 'c-lang', 'aria-label': 'Language' });
    LANGS.forEach(function (l) { var o = el('option', { value: l[0], text: l[1] }); if (l[0] === LANG) o.selected = true; lang.appendChild(o); });
    lang.addEventListener('change', function () { settings.lang = lang.value; saveSettings(); setLang(lang.value); renderConnect(root); });
    var localCard = el('div', { class: 'choice primary' },
      el('div', { class: 'choice-head' }, el('h2', { text: tr('Локально') }), el('span', { class: 'badge', text: tr('Рекомендуем') })),
      el('p', { text: tr('Всё остаётся в этом браузере. Без аккаунта, работает без интернета. Другие устройства и Claude эти данные не увидят.') }),
      el('div', { class: 'actions' }, localBtn));
    var ghCard = el('div', { class: 'choice' },
      el('div', { class: 'choice-head' }, el('h2', { text: tr('Бесплатная синхронизация через GitHub') }), el('span', { class: 'badge', text: 'Free sync' })),
      el('p', { text: tr('Задачи лежат в вашем приватном репозитории GitHub: они одинаковы на всех устройствах, у них есть история, и с ними может работать Claude.') }),
      el('div', { class: 'actions' }, ghBtn), form);
    // на телефоне главное это подключиться к своим данным: синхронизация первой и сразу раскрыта
    root.appendChild(el('div', { class: 'connect' },
      el('div', { class: 'connect-top' }, el('h1', { text: tr('Где хранить задачи?') }), lang),
      narrow.matches ? ghCard : localCard, narrow.matches ? localCard : ghCard));
    if (narrow.matches) { form.hidden = false; ghBtn.hidden = true; }
    ['sync', 'search', 'btn-claude', 'new-task', 'btn-help', 'btn-settings', 'm-note'].forEach(function (id) { $(id).hidden = true; });
    $('mtabs').style.display = 'none';
  }
  function start(b, m) {
    backend = b; mode = m; files = {}; syncErr = null;
    $('mtabs').style.display = '';
    actions = lsGet('tt-pending-v1:' + repoKey()) || [];
    ['search', 'new-task', 'btn-help', 'btn-settings', 'm-note'].forEach(function (id) { $(id).hidden = false; });
    $('btn-claude').hidden = m === 'local';
    introFlag = true; introUntil = performance.now() + 2500;
    ensureFile(P_BOARD); ensureFile(P_INBOX); ensureFile(P_PRESETS); if (m === 'github') ensureFile(P_REPORT);
    actions.forEach(function (a) { a.ops.forEach(function (op) { ensureFile(op.path); }); });
    render();
    schedulePoll();
    scheduleFlush();
  }

  /* ---------- оболочка ---------- */
  function setTop() { document.documentElement.style.setProperty('--top', $('top').offsetHeight + 'px'); }
  window.addEventListener('resize', function () { setTop(); if (document.querySelector('.tg') && (PPM < minPPM() - 1e-6 || zoom.atMin)) { applyZoom(minPPM()); } });
  var lastHover = null;
  $('view').addEventListener('pointerover', function (e) {
    if (e.pointerType === 'touch' || drag || dragId || interacting) return;
    var n = e.target.closest && e.target.closest('.card, .ev, .chip');
    if (!n || n.classList.contains('ghost') || n.classList.contains('drag-src')) { return; }
    if (e.relatedTarget && n.contains(e.relatedTarget)) return;
    if (n === lastHover && performance.now() - (n._hv || 0) < 300) return;
    lastHover = n; n._hv = performance.now();
    sfxHover(hoverKey(n));
  });
  $('mt-cal').addEventListener('click', function () { mtab = 'cal'; introFlag = true; introUntil = performance.now() + 800; render(); });
  $('mt-board').addEventListener('click', function () { mtab = 'board'; introFlag = true; introUntil = performance.now() + 800; render(); });
  $('new-task').addEventListener('click', function () { openNew({}); });
  $('btn-claude').addEventListener('click', claudeModal);
  $('btn-settings').addEventListener('click', settingsModal);
  $('btn-help').addEventListener('click', helpModal);
  $('m-note').addEventListener('click', noteSheet);
  $('search').addEventListener('input', function (e) { query = e.target.value.trim(); render(); });
  $('sync').addEventListener('click', function () { if (actions.length) flush('manual'); else poll(); });
  ['pointerdown', 'keydown', 'input'].forEach(function (t) { document.addEventListener(t, activity, true); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (settings.onHide || mode === 'local') flush('hide'); } else poll();
  });
  window.addEventListener('pagehide', function () { if (settings.onHide || mode === 'local') flush('hide'); });
  window.addEventListener('blur', function () { if (settings.onBlur) flush('blur'); });
  window.addEventListener('online', function () {
    if (!backend) return;
    syncErr = null;
    Object.keys(files).forEach(function (p) { if (files[p].state !== 'ready') loadFile(p); });
    flush('online');
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  setInterval(function () { var d = todayISO; tickToday(); if (d !== todayISO) softRender(); else { var n = document.querySelector('.now'); if (n) n.style.top = (nowMin() * PPM) + 'px'; } }, 60000);
  setTop();
  if (cfg && cfg.mode === 'local') start(new LocalBackend(), 'local');
  else if (cfg && cfg.token && cfg.branch) start(new GitHubBackend(cfg), 'github');
  else render();
  window.__tt = { files: function () { return files; }, actions: function () { return actions; }, flush: flush, backend: function () { return backend; } };
})();
